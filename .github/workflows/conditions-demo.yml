name: condition-demo

on:
  push:
    branches:
      - develop
      - 'feature/**'

jobs:
  demonstrate-condition:
    runs-on: ubuntu-latest

    steps:
      - name: show workflow event
        run: echo "Event: ${{ github.event_name }}"

      - name: run only on develop
        if: github.ref == 'refs/heads/develop'
        run: echo "this step runs on develop"

      - name: Run only on feature branches
        if: startsWith(github.ref, 'refs/heads/feature/')
        run: echo "This step runs on a feature branch"
